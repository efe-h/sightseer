spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sightseer_db}
    username: ${POSTGRES_USER:sightseer_user}
    password: ${POSTGRES_PASSWORD:sightseer_password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT1H

services:
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8000}

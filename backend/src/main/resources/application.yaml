spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sightseer_db
    username: sightseer_user
    password: sightseer_password

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.springframework.boot.context.config: DEBUG

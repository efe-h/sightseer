name: Recommender Tests and FastAPI Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recommender-tests:
    name: Python recommender tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rag-pipeline/requirements.txt

      - name: Run recommender unit tests
        run: |
          python -m pytest recommendation_engine/tests -v
